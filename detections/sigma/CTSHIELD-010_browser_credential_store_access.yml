title: Suspicious Browser Credential Store File Access
id: 7c41e8b2-5f93-46a7-a012-8d6e3c75b194
status: experimental
description: Detects Windows Security Event ID 4663 file access to browser credential-store files associated with Chrome, Firefox, or Opera.
references:
  - https://attack.mitre.org/techniques/T1555/003/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4663
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectType: File
    ObjectName|contains:
      - '\Opera Software\Opera Stable\Login Data'
      - '\Mozilla\Firefox\Profiles\'
      - '\Google\Chrome\User Data\'
  condition: selection
falsepositives:
  - Legitimate browser processes accessing their own credential databases
  - Browser profile maintenance or backup software
  - Authorized forensic or security tooling
level: high
