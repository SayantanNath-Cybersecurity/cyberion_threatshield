title: PowerShell Credential Prompt and Credential Extraction
id: 6e91c4b7-2d53-48af-a815-7c3e9f206b41
status: experimental
description: Detects PowerShell Script Block Logging events containing credential prompting and credential extraction behavior.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_logging_windows
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  service: powershell
detection:
  selection:
    EventID: 4104
    ScriptBlockText|contains:
      - 'PromptForCredential'
      - 'GetNetworkCredential().password'
  condition: selection
falsepositives:
  - Legitimate PowerShell scripts that prompt users for credentials
  - Administrative automation involving credential validation
  - Security or identity management tooling using PowerShell credential APIs
level: high
