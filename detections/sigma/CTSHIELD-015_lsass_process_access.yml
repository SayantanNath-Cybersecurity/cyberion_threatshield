title: Mimikatz Process Access to LSASS
id: 6d2f8a41-9c57-4be3-a106-7e5c91d2f834
status: experimental
description: Detects Sysmon Event ID 10 process access where mimikatz.exe accesses the LSASS process.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/sysinternals/downloads/sysmon
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    SourceImage|endswith: '\mimikatz.exe'
    TargetImage|endswith: '\lsass.exe'
  condition: selection
falsepositives:
  - Authorized security testing with Mimikatz
  - Incident response or forensic analysis using Mimikatz
  - Security research environments
level: high
