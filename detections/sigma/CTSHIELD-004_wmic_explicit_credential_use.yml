title: WMIC Explicit Credential Use
id: 91d4c7e2-5b83-4f16-a902-6e71c8d43f25
status: experimental
description: Detects explicit credential use by WMIC.exe through Windows Security Event ID 4648. The detection focuses on WMIC process activity where explicit credentials are used for a target account.
references:
  - https://attack.mitre.org/techniques/T1047/
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4648
    ProcessName|endswith: '\WMIC.exe'
    TargetUserName|exists: true
  condition: selection
falsepositives:
  - Legitimate administrative WMI activity using explicit credentials
  - Enterprise management or configuration tools using WMIC
  - Authorized remote administration
level: medium
