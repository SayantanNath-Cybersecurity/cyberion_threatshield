title: IIS Worker Process Credential Use Followed by Successful Logon
id: 4f7b2c91-6e35-48a0-bd17-93c5e2f71468
status: experimental
description: Correlates explicit credential use by the IIS worker process with a subsequent successful network logon involving the same target account.
references:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4648
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4624
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.t1078
correlation:
  type: temporal_ordered
  rules:
    - 8c4a1e73-5d92-46b0-af31-7e6c2d854901
    - 2b9f6d41-73c5-4e82-a018-5d7c9b263450
  group-by:
    - SubjectUserName
    - TargetUserName
  timespan: 1m
falsepositives:
  - Legitimate IIS application authentication
  - Authorized service-account impersonation
  - Normal web application authentication workflows
level: high
---
title: IIS Worker Process Explicit Credential Use
id: 8c4a1e73-5d92-46b0-af31-7e6c2d854901
name: iis_explicit_credential_use
status: experimental
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4648
    ProcessName|endswith: '\w3wp.exe'
  condition: selection
level: medium
---
title: IIS Worker Process Successful Network Logon
id: 2b9f6d41-73c5-4e82-a018-5d7c9b263450
name: iis_successful_network_logon
status: experimental
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    ProcessName|endswith: '\w3wp.exe'
  condition: selection
level: medium
